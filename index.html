<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Supabase settings, including where the sign-in is saved (used just below) -->
  <script src="config.js"></script>
  <script>
    // Before the page paints, pick the theme and which screen to show (the
    // sign-in page or the to-do list), so the wrong one never flashes up
    (function () {
      const root = document.documentElement;
      let theme = null;
      let signedIn = false;
      let guest = false;
      try {
        theme = localStorage.getItem("todo-theme");
        signedIn = typeof AUTH_STORAGE_KEY === "string" && !!localStorage.getItem(AUTH_STORAGE_KEY);
        guest = localStorage.getItem("todo-mode") === "guest";
      } catch {}
      if (!theme) {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      root.dataset.theme = theme;
      root.dataset.account = signedIn ? "user" : "guest";

      // Just back from Google (?code=… or ?error=…): stay on the sign-in card
      // while it finishes, showing "Signing you in…" if it worked
      const back = location.search + location.hash;
      const returning = /[?&#](code|error)=/.test(back);
      if (/[?&#]code=/.test(back)) root.dataset.signingIn = "";
      root.dataset.screen = (signedIn || guest) && !returning ? "app" : "signin";
    })();
  </script>
</head>
<body>
  <!-- Google's "G" logo, drawn once and reused by the sign-in buttons -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="g-logo" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </symbol>
  </svg>

  <!-- Ambient aurora lights drifting behind everything -->
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <!-- Sign-in page: shown instead of the to-do list until you sign in or
       choose guest mode -->
  <section id="signin" class="signin-card" aria-labelledby="signin-title">
    <button type="button" class="theme-toggle" title="Toggle theme">🌙</button>

    <div class="brand-mark rise" style="--i: 0" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5" /></svg>
    </div>
    <h1 id="signin-title" class="rise" style="--i: 1">My To-Do List</h1>
    <p class="signin-sub rise" style="--i: 2">Your tasks, on all your devices</p>

    <!-- Appears if sign-in is cancelled or fails -->
    <p id="signin-error" class="signin-error" role="alert" hidden></p>

    <button type="button" id="google-btn" class="btn-google rise" style="--i: 3">
      <span class="btn-face idle">
        <svg width="20" height="20" aria-hidden="true"><use href="#g-logo" /></svg>
        Continue with Google
      </span>
      <span class="btn-face busy" aria-hidden="true">
        <span class="spinner"></span>
        Signing you in…
      </span>
    </button>

    <div class="divider rise" style="--i: 4">or</div>

    <button type="button" id="guest-btn" class="btn-guest rise" style="--i: 5">Continue as guest</button>
    <p class="guest-note rise" style="--i: 6">Guest tasks stay on this device only</p>
  </section>

  <div class="layout">
  <main class="app">
    <header class="app-header">
      <h1>My To-Do List</h1>
      <div class="header-actions">
        <!-- Guest mode: back to the sign-in page (just the G on phones) -->
        <button type="button" id="sign-in-btn" class="signin-pill" aria-label="Sign in">
          <svg width="18" height="18" aria-hidden="true"><use href="#g-logo" /></svg>
          <span class="pill-text">Sign in</span>
        </button>

        <!-- Signed in: your Google photo (initials until it loads), opening a small menu -->
        <div class="account">
          <button type="button" id="avatar-btn" class="avatar-btn" aria-label="Account" aria-expanded="false" aria-controls="account-menu">
            <span id="avatar-initials"></span>
            <img id="avatar-img" class="avatar-img" alt="" referrerpolicy="no-referrer">
          </button>
          <div id="account-menu" class="account-menu">
            <div class="menu-user">
              <div id="menu-name" class="menu-name"></div>
              <div id="menu-email" class="menu-email"></div>
            </div>
            <div class="menu-sep"></div>
            <button type="button" id="sign-out-btn" class="menu-item">Sign out</button>
          </div>
        </div>

        <button id="theme-toggle" class="theme-toggle" type="button" title="Toggle theme">🌙</button>
      </div>
    </header>

    <nav id="list-tabs" class="list-tabs" aria-label="Task lists"></nav>

    <form id="task-form" class="task-form">
      <span class="input-wrap">
        <input
          type="text"
          id="task-input"
          placeholder="What needs to be done?"
          autocomplete="off"
          maxlength="500"
          required
        >
        <!-- Light ray that runs once around the box when you click into it -->
        <svg id="input-ray" class="ray" aria-hidden="true">
          <rect class="ray-glow" pathLength="100" />
          <rect class="ray-core" pathLength="100" />
        </svg>
      </span>
      <!-- Shows "Add" on wider screens and a round "+" on phones -->
      <button type="submit" class="add-btn" aria-label="Add task">
        <span class="add-text">Add</span><span class="add-plus" aria-hidden="true">+</span>
      </button>
    </form>

    <!-- All lists sit side by side in the track; the viewport shows one at a time -->
    <div id="list-viewport" class="list-viewport">
      <div id="list-track" class="list-track"></div>
    </div>
  </main>

  <!-- Progress panel: gauge for the open list, bars for today / week / month -->
  <aside id="stats" class="stats" aria-label="Progress">
    <h2 class="stats-title">Progress</h2>

    <!-- Phones only: a compact one-line summary; tap it to open the full panel -->
    <button type="button" id="stats-summary" class="stats-summary" aria-expanded="false" aria-controls="stats-collapse">
      <svg class="mini-ring" viewBox="0 0 36 36" aria-hidden="true">
        <circle class="mini-track" cx="18" cy="18" r="15" pathLength="100" />
        <circle id="mini-fill" class="mini-fill" cx="18" cy="18" r="15" pathLength="100" />
      </svg>
      <span id="mini-label" class="mini-label"></span>
      <span class="mini-pct"><span id="mini-pct"></span>%</span>
      <span class="mini-count"><span id="mini-done" class="roll"></span>/<span id="mini-total" class="roll"></span></span>
      <svg class="mini-chevron" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <!-- On phones this folds open and shut; on wider screens it's always open -->
    <div id="stats-collapse" class="stats-collapse">
    <div class="stats-collapse-inner">
    <div class="stats-body">
      <div class="gauge">
        <!-- A 270° arc, open at the bottom. pathLength="100" lets us fill it by percentage -->
        <svg class="gauge-svg" viewBox="0 0 200 200" aria-hidden="true">
          <path class="gauge-track" d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57" pathLength="100" />
          <path id="gauge-fill" class="gauge-fill" d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57" pathLength="100" />
        </svg>
        <div class="gauge-center">
          <div class="gauge-pct"><span id="gauge-pct"></span>%</div>
          <div class="gauge-sub">
            <span id="gauge-done" class="roll"></span> of <span id="gauge-total" class="roll"></span> done
          </div>
        </div>
        <div id="gauge-label" class="gauge-label"></div>
      </div>

      <div id="stat-bars" class="bars"></div>
    </div>
    </div>
    </div>
  </aside>
  </div>

  <!-- Short messages that slide up from the bottom (e.g. after signing in) -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>

  <!-- Cloud sync. "defer" loads these without holding up the page; they run
       in this order once the page is ready. The Supabase library is pinned to
       an exact version, and "integrity" is its fingerprint: the browser won't
       run it if the file it gets is any different. -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
    integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
    crossorigin="anonymous"
  ></script>
  <script defer src="sync.js"></script>
</body>
</html>
