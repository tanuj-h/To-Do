<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved (or system) theme before the page paints, to avoid a flash
    (function () {
      let theme = null;
      try { theme = localStorage.getItem("todo-theme"); } catch {}
      if (!theme) {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>My To-Do List</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" title="Toggle theme">🌙</button>
    </header>

    <nav id="list-tabs" class="list-tabs" aria-label="Task lists"></nav>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="What needs to be done?"
        autocomplete="off"
        required
      >
      <button type="submit">Add</button>
    </form>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-message" class="empty-message">No tasks yet. Add one above!</p>
    <p id="task-count" class="task-count"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
