<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved (or system) theme before the page paints, to avoid a flash
    (function () {
      let theme = null;
      try { theme = localStorage.getItem("todo-theme"); } catch {}
      if (!theme) {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>My To-Do List</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" title="Toggle theme">🌙</button>
    </header>

    <nav id="list-tabs" class="list-tabs" aria-label="Task lists"></nav>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="What needs to be done?"
        autocomplete="off"
        required
      >
      <button type="submit">Add</button>
    </form>

    <!-- All lists sit side by side in the track; the viewport shows one at a time -->
    <div id="list-viewport" class="list-viewport">
      <div id="list-track" class="list-track"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
