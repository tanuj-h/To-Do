<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved (or system) theme before the page paints, to avoid a flash
    (function () {
      let theme = null;
      try { theme = localStorage.getItem("todo-theme"); } catch {}
      if (!theme) {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <!-- Ambient aurora lights drifting behind everything -->
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <div class="layout">
  <main class="app">
    <header class="app-header">
      <h1>My To-Do List</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" title="Toggle theme">🌙</button>
    </header>

    <nav id="list-tabs" class="list-tabs" aria-label="Task lists"></nav>

    <form id="task-form" class="task-form">
      <span class="input-wrap">
        <input
          type="text"
          id="task-input"
          placeholder="What needs to be done?"
          autocomplete="off"
          required
        >
        <!-- Light ray that runs once around the box when you click into it -->
        <svg id="input-ray" class="ray" aria-hidden="true">
          <rect class="ray-glow" pathLength="100" />
          <rect class="ray-core" pathLength="100" />
        </svg>
      </span>
      <button type="submit">Add</button>
    </form>

    <!-- All lists sit side by side in the track; the viewport shows one at a time -->
    <div id="list-viewport" class="list-viewport">
      <div id="list-track" class="list-track"></div>
    </div>
  </main>

  <!-- Progress panel: gauge for the open list, bars for today / week / month -->
  <aside id="stats" class="stats" aria-label="Progress">
    <h2 class="stats-title">Progress</h2>
    <div class="stats-body">
      <div class="gauge">
        <!-- A 270° arc, open at the bottom. pathLength="100" lets us fill it by percentage -->
        <svg class="gauge-svg" viewBox="0 0 200 200" aria-hidden="true">
          <path class="gauge-track" d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57" pathLength="100" />
          <path id="gauge-fill" class="gauge-fill" d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57" pathLength="100" />
        </svg>
        <div class="gauge-center">
          <div class="gauge-pct"><span id="gauge-pct"></span>%</div>
          <div class="gauge-sub">
            <span id="gauge-done" class="roll"></span> of <span id="gauge-total" class="roll"></span> done
          </div>
        </div>
        <div id="gauge-label" class="gauge-label"></div>
      </div>

      <div id="stat-bars" class="bars"></div>
    </div>
  </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
